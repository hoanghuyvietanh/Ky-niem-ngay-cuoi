<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kỷ niệm ngày cưới</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<!-- Tích hợp Firebase App và Firestore -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  :root{ --bg:#fbf6f1; --ink:#3b2a2a; --muted:#8a7470; --rose:#c0626e; --rose-soft:#f3dcdc; --gold:#b8935a; --card:#ffffff; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  h1,h2,h3{font-family:'Playfair Display',serif;font-weight:500}
  
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px;position:relative;overflow:hidden; z-index: 1;}
  .hero .tag{letter-spacing:.35em;text-transform:uppercase;font-size:.75rem;color:var(--gold)}
  .hero h1{font-size:clamp(2.6rem,9vw,5.5rem);margin:14px 0 6px;color:var(--ink)}
  .hero h1 span{color:var(--rose);font-style:italic;font-weight:500}
  .hero .date{color:var(--muted);font-size:1.05rem}
  .counter{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:36px 0 18px}
  .counter div{background:var(--card);border-radius:16px;padding:16px 18px;min-width:84px;box-shadow:0 6px 24px rgba(192,98,110,.12)}
  .counter b{display:block;font-family:'Playfair Display',serif;font-size:2rem;color:var(--rose);font-weight:700}
  .counter small{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}
  .heart{position:absolute;color:var(--rose);opacity:.18;animation:float linear infinite;user-select:none; z-index: -1;}
  @keyframes float{from{transform:translateY(105vh)}to{transform:translateY(-15vh)}}

  main{max-width:1100px;margin:0 auto;padding:40px 18px 80px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px}
  .toolbar h2{font-size:1.8rem}
  .year{position:relative;padding-left:34px;margin-bottom:64px;border-left:2px dashed #e3c9c9}
  .year::before{content:"♥";position:absolute;left:-12px;top:0;width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--rose);font-size:18px;line-height:22px;text-align:center}
  .badge{display:inline-block;background:var(--rose);color:#fff;border-radius:999px;padding:2px 14px;font-size:.8rem;letter-spacing:.08em}
  .year h3{font-size:2rem;margin:8px 0 4px}
  .grid{columns:3 240px;column-gap:20px}
  .ph{break-inside:avoid; margin-bottom:20px; background:var(--card); padding: 12px 12px 60px 12px; box-shadow:0 4px 16px rgba(59,42,42,.08); position:relative;}
  .ph img{width:100%;display:block;}
  .ph .cap{position:absolute; inset:auto 0 0 0; height: 60px; display: flex; align-items: center; justify-content: center; font-family: 'Caveat', cursive; font-size: 1.4rem;}
  footer{text-align:center;color:var(--muted);padding:30px 0 50px;font-size:.9rem; cursor:pointer;}
  .music-btn {position: fixed; bottom: 20px; right: 20px; z-index: 100; width: 48px; height: 48px; border-radius: 50%; background: var(--rose); color: white; border: none; font-size: 1.2rem; cursor:pointer;}

  /* ===== CSS ADMIN PANEL ===== */
  #admin-panel {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000;
    overflow-y: auto; padding: 20px; color: #333;
  }
  .admin-box { background: #fff; max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 12px; }
  .admin-box h2 { border-bottom: 2px solid var(--rose); padding-bottom: 10px; margin-bottom: 20px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-weight: 500; margin-bottom: 5px; }
  .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;}
  .btn-save { background: var(--rose); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%;}
  .btn-close { float: right; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
  #uploadStatus { color: green; font-weight: bold; margin-top: 10px; display: none;}
</style>
</head>
<body>

<button id="musicToggle" class="music-btn">🔇</button>
<audio id="bgMusic" loop></audio>

<header class="hero" id="top">
  <div class="tag">Our Love Story</div>
  <h1 id="names">Đang tải dữ liệu...</h1>
  <div class="date" id="wdate"></div>
  <div class="counter" id="counter"></div>
</header>

<main id="timeline">
  <div class="toolbar"><h2>Hành trình của chúng mình</h2></div>
  <div id="years"></div>
</main>

<footer id="foot">Made with ♥ — Chạm 5 lần vào đây để sửa</footer> 

<!-- ===== BẢNG ĐIỀU KHIỂN BÍ MẬT ===== -->
<div id="admin-panel">
  <div class="admin-box">
    <button class="btn-close" onclick="closeAdmin()">✕</button>
    
    <h2>Cài đặt Chung</h2>
    <div class="form-group"><label>Tên chồng:</label><input type="text" id="cfg-name1"></div>
    <div class="form-group"><label>Tên vợ:</label><input type="text" id="cfg-name2"></div>
    <div class="form-group"><label>Ngày cưới (YYYY-MM-DD):</label><input type="date" id="cfg-date"></div>
    <div class="form-group"><label>Link nhạc (MP3):</label><input type="text" id="cfg-music"></div>
    <button class="btn-save" onclick="saveConfig()">Lưu Cài đặt Chung</button>

    <h2 style="margin-top: 40px;">Thêm ảnh mới từ Link Google Drive</h2>
    <div class="form-group"><label>Năm kỷ niệm (vd: 2025):</label><input type="number" id="img-year" value="2025"></div>
    <div class="form-group"><label>Link ảnh (Từ Google Drive):</label><input type="text" id="img-url" placeholder="Dán link chia sẻ ảnh vào đây"></div>
    <div class="form-group"><label>Lời tựa (Caption):</label><input type="text" id="img-cap" placeholder="Nhập ghi chú cho ảnh"></div>
    <button class="btn-save" onclick="addPhoto()" style="background: var(--gold);">Thêm ảnh vào dòng thời gian</button>
    <div id="uploadStatus">Đang lưu dữ liệu...</div>

    <div id="delete-section">
      <h2 style="margin-top: 40px; color: red;">Xóa dữ liệu</h2>
      <div class="form-group">
          <label>Chọn năm muốn xóa toàn bộ ảnh:</label>
          <select id="delete-year-select"></select>
      </div>
      <button class="btn-save" onclick="deleteYearData()" style="background: red;">Xóa Năm Này</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   🔥 DÁN FIREBASE CONFIG CỦA BẠN VÀO ĐÂY 🔥
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyB-xxxxxxx",
  authDomain: "ky-niem-ngay-cuoi.firebaseapp.com",
  projectId: "ky-niem-ngay-cuoi",
  storageBucket: "ky-niem-ngay-cuoi.appspot.com",
  messagingSenderId: "xxxxxx",
  appId: "1:xxxxx:web:xxxxx"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let CONFIG = { names: ["Chồng", "Vợ"], weddingDate: "2024-11-20", musicUrl: "", anniversaries: [] };
let wd = new Date();

// 1. Lắng nghe dữ liệu
db.collection("settings").doc("main").onSnapshot((doc) => {
  if (doc.exists) {
    CONFIG = doc.data(); 
    renderWebsite();     
  } else {
    db.collection("settings").doc("main").set(CONFIG);
  }
});

const $ = s => document.querySelector(s);
function renderWebsite() {
  wd = new Date(CONFIG.weddingDate + "T00:00:00");
  $("#names").innerHTML = `${CONFIG.names[0]} <span>&</span> ${CONFIG.names[1]}`;
  const fmt = d => d.toLocaleDateString("vi-VN",{day:"numeric",month:"long",year:"numeric"});
  $("#wdate").textContent = "Ngày cưới: " + fmt(wd);
  
  const bgMusic = $("#bgMusic");
  if(bgMusic.src !== CONFIG.musicUrl) bgMusic.src = CONFIG.musicUrl;

  const list = [...(CONFIG.anniversaries || [])].sort((a,b) => b.year - a.year);
  $("#years").innerHTML = list.map(a => {
    const photos = (a.photos||[]).map(p => `
      <figure class="ph">
        <img src="${p.src}" loading="lazy">
        ${p.caption ? `<figcaption class="cap">${p.caption}</figcaption>` : ""}
      </figure>`).join("");
    return `<section class="year">
      <span class="badge">${a.year}</span>
      <h3>Kỷ niệm năm ${a.year}</h3>
      <div class="grid">${photos}</div>
    </section>`;
  }).join("");

  updateDeleteList();
}

// 2. Đồng hồ
function tick(){
  const now=new Date();
  let y=now.getFullYear()-wd.getFullYear(); let m=now.getMonth()-wd.getMonth(); let d=now.getDate()-wd.getDate();
  if(d<0){m--; d+=new Date(now.getFullYear(),now.getMonth(),0).getDate();}
  if(m<0){y--; m+=12;}
  const box=(n,l)=>`<div><b>${n}</b><small>${l}</small></div>`;
  $("#counter").innerHTML = box(y,"năm")+box(m,"tháng")+box(d,"ngày");
}
setInterval(tick,1000);

// 3. Nhạc nền
let isPlaying = false;
$("#musicToggle").onclick = () => {
  if (isPlaying) { $("#bgMusic").pause(); $("#musicToggle").textContent = "🔇"; } 
  else { $("#bgMusic").play(); $("#musicToggle").textContent = "🎵"; }
  isPlaying = !isPlaying;
};

// 4. Mở Admin (Click 5 lần)
let clicks = 0;
$("#foot").addEventListener("click", () => {
  clicks++;
  if(clicks >= 2) {
    clicks = 0;
    const pwd = prompt("Nhập mật khẩu để mở khóa:");
    if(pwd === "Viet@nh17072001") { 
      $("#admin-panel").style.display = "block";
      $("#cfg-name1").value = CONFIG.names[0] || "";
      $("#cfg-name2").value = CONFIG.names[1] || "";
      $("#cfg-date").value = CONFIG.weddingDate || "";
      $("#cfg-music").value = CONFIG.musicUrl || "";
    } else {
      alert("Sai mật khẩu!");
    }
  }
});
function closeAdmin() { $("#admin-panel").style.display = "none"; }

// 5. Lưu Cấu hình chung
function saveConfig() {
  CONFIG.names[0] = $("#cfg-name1").value;
  CONFIG.names[1] = $("#cfg-name2").value;
  CONFIG.weddingDate = $("#cfg-date").value;
  CONFIG.musicUrl = $("#cfg-music").value;
  db.collection("settings").doc("main").update(CONFIG)
    .then(() => alert("Đã lưu cài đặt!"))
    .catch(err => alert("Lỗi: " + err.message));
}

// 6. Xử lý thêm link ảnh (Hỗ trợ lách luật Google Drive)
async function addPhoto() {
  const year = parseInt($("#img-year").value);
  const caption = $("#img-cap").value;
  let imgUrl = $("#img-url").value.trim();

  if(!imgUrl) return alert("Vui lòng dán link ảnh!");

  const status = $("#uploadStatus");
  status.style.display = "block";
  status.style.color = "blue";
  status.textContent = "Đang lưu dữ liệu...";

  // THUẬT TOÁN: Tự động trích xuất ID và ép thành link Thumbnail để không bị Google chặn
  let driveIdMatch = imgUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || imgUrl.match(/id=([a-zA-Z0-9_-]+)/);
  if (driveIdMatch && driveIdMatch[1]) {
    // sz=w1000 giúp ảnh hiển thị độ phân giải cao
    imgUrl = `https://drive.google.com/thumbnail?id=${driveIdMatch[1]}&sz=w1000`;
  }

  try {
    if (!CONFIG.anniversaries) CONFIG.anniversaries = [];
    let yearData = CONFIG.anniversaries.find(a => a.year === year);
    if (!yearData) {
      yearData = { year: year, photos: [] };
      CONFIG.anniversaries.push(yearData);
    }
    
    yearData.photos.push({ src: imgUrl, caption: caption });
    await db.collection("settings").doc("main").update({ anniversaries: CONFIG.anniversaries });

    status.style.color = "green";
    status.textContent = "Thêm ảnh thành công! Đóng bảng này lại để xem.";
    $("#img-url").value = ""; 
    $("#img-cap").value = "";
  } catch(err) {
    status.style.color = "red";
    status.textContent = "Lỗi: " + err.message;
  }
}

// 7. Cập nhật danh sách năm để xóa
function updateDeleteList() {
    const select = document.getElementById("delete-year-select");
    select.innerHTML = "";
    if(CONFIG.anniversaries && CONFIG.anniversaries.length > 0) {
        CONFIG.anniversaries.forEach(a => {
            const option = document.createElement("option");
            option.value = a.year;
            option.textContent = "Năm " + a.year;
            select.appendChild(option);
        });
    } else {
        select.innerHTML = "<option value=''>Chưa có dữ liệu năm nào</option>";
    }
}

// 8. Xóa dữ liệu của một năm
async function deleteYearData() {
    const yearToDelete = parseInt($("#delete-year-select").value);
    if(isNaN(yearToDelete)) return alert("Không có năm nào để xóa.");
    
    if(confirm(`Bạn có chắc chắn muốn xóa TOÀN BỘ ảnh của năm ${yearToDelete} không?`)) {
        try {
            CONFIG.anniversaries = CONFIG.anniversaries.filter(a => a.year !== yearToDelete);
            await db.collection("settings").doc("main").update({ anniversaries: CONFIG.anniversaries });
            alert(`Đã xóa dữ liệu năm ${yearToDelete} thành công!`);
        } catch (err) {
            alert("Lỗi khi xóa: " + err.message);
        }
    }
}
</script>
</body>
</html>
